<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intégration — guides d'automatisme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#D6D9D2; --panel-2:#C6CAC2; --card:#FBFBFA; --card-2:#F1F2EE;
  --ink:#141A20; --ink-2:#3D4954; --ink-3:#77838E;
  --rail:#98A1A7; --line:#B9BEB7;
  --signal:#E2570F; --signal-deep:#A83D06;
  --live:#2C7A44; --bu:#1668B3;
  --disp:'IBM Plex Sans Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--panel);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:.015em;margin:0}
code,.mono,.m{font-family:var(--mono)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{background:var(--ink);color:var(--card);border-bottom:3px solid var(--signal);position:sticky;top:0;z-index:50}
.hbar{display:flex;align-items:center;gap:20px;padding:14px 0;flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;white-space:nowrap;border:0;background:none;color:var(--card);padding:0}
.logo span{color:var(--signal)}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid #39434D;border-radius:2px;background:#1E262E;color:var(--card);font-family:var(--mono);font-size:13px}
.search input::placeholder{color:#6E7A85}
.search input:focus{outline:2px solid var(--signal);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:11px;top:11px;width:14px;height:14px;stroke:#6E7A85;fill:none;stroke-width:2}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:2px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;cursor:pointer;font-family:var(--body);font-size:14px;color:var(--ink);border-bottom:1px solid var(--card-2)}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--card-2)}
.results .ref{font-family:var(--mono);font-weight:600}
.results .sub{color:var(--ink-3);font-size:12px}

.crumbs{background:var(--panel-2);border-bottom:1px solid var(--line)}
.crumbs .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2);font:inherit;text-transform:inherit}
.crumbs button:hover{color:var(--signal)}
.crumbs .sep{color:var(--rail)}
.crumbs .now{color:var(--ink);font-weight:600}

main{padding:34px 0 70px}
.step{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:600;display:block;margin-bottom:7px}
.title{font-size:clamp(24px,4vw,36px);font-weight:700;text-transform:uppercase;line-height:1.05}
.lede{color:var(--ink-2);max-width:64ch;margin:11px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:26px}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rail);border-radius:2px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-left-color .12s,transform .12s}
.tile:hover:not([disabled]){border-left-color:var(--signal);transform:translateX(2px)}
.tile h3{font-size:17px;font-weight:600;text-transform:uppercase}
.tile p{margin:5px 0 0;font-size:13px;color:var(--ink-3);line-height:1.45}
.tile .badge{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--card-2);color:var(--ink-2);padding:2px 6px;border-radius:2px}
.tile.top{border-left-color:var(--signal)}
.tile.top .badge{background:var(--signal);color:#fff}
.tile[disabled]{opacity:.42;cursor:not-allowed}

.guide{background:var(--card);border:1px solid var(--line);border-radius:2px;margin-top:24px}
.guide-head{padding:26px 28px;border-bottom:1px solid var(--line);background:var(--card-2)}
.chain{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--card);padding:4px 9px;border-radius:2px}
.chip.alt{background:none;color:var(--ink-2);border:1px solid var(--line)}
.chip.mode{background:var(--signal)}
section.blk{padding:26px 28px;border-bottom:1px solid var(--line)}
section.blk:last-child{border-bottom:0}
.blk > h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:15px;display:flex;align-items:baseline;gap:9px}
.blk > h2::before{content:attr(data-n);font-family:var(--mono);color:var(--signal);font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--card-2);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500}
td.num{font-family:var(--mono)}
tr:last-child td,tr:last-child th{border-bottom:0}

.frame-caption{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:9px;letter-spacing:.05em}
.bytes{display:grid;border:2px solid var(--ink);border-radius:2px;overflow:hidden}
.byte{height:62px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;font-weight:600;text-align:center;line-height:1.25}
.byte:last-child{border-right:0}
.byte.nil{background:repeating-linear-gradient(45deg,var(--card-2),var(--card-2) 5px,#E4E6E1 5px,#E4E6E1 10px);color:var(--ink-3)}
.ruler{display:grid;margin-top:5px}
.tick{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;border-top:1px solid var(--rail);padding-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12.5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.pins{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.pins svg{flex:0 0 150px}
.pins table{flex:1;min-width:270px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--ink-3);margin-right:7px;vertical-align:-1px}

.note{border-left:4px solid var(--rail);background:var(--card-2);padding:13px 16px;margin:15px 0 0;font-size:13.5px;border-radius:0 2px 2px 0}
.note.warn{border-left-color:var(--signal);background:#FDF0E7}
.note.info{border-left-color:var(--bu);background:#EAF2FA}
.note b{font-family:var(--disp);text-transform:uppercase;font-size:12px;letter-spacing:.07em;display:block;margin-bottom:3px}
.note.warn b{color:var(--signal-deep)}
.note.info b{color:#12558F}
pre{background:var(--ink);color:#DCE3E9;padding:16px;border-radius:2px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;margin:0}
pre .c{color:#7A8A97}
pre .k{color:#F5A26A}
pre .n{color:#8FC7F0}
pre.lad{background:#F7F8F5;color:var(--ink);border:1px solid var(--line);font-size:12px}
pre.lad .r{color:var(--signal);font-weight:600}
pre.lad .c{color:var(--ink-3)}

.tabs{display:flex;margin-bottom:14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 15px;cursor:pointer;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--signal);border-bottom-color:var(--signal);font-weight:600}
.tab[disabled]{opacity:.4;cursor:not-allowed}
.lang{display:none}
.lang.on{display:block}

.model-note{margin-top:34px;padding:18px 20px;border:1px dashed var(--rail);border-radius:2px;font-size:13px;color:var(--ink-2);background:rgba(255,255,255,.35)}
.model-note b{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12px;display:block;margin-bottom:5px;color:var(--ink)}
.back{border:0;background:none;font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;padding:0;margin-bottom:16px;text-transform:uppercase;letter-spacing:.06em}
.back:hover{color:var(--signal)}
@media (max-width:620px){.byte{height:54px;font-size:9px}section.blk,.guide-head{padding:20px 17px}}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <button class="logo" onclick="go('home')">Inté<span>gration</span></button>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Chercher une référence — ex. LDH292, FR-S01" autocomplete="off"
             oninput="search(this.value)" onblur="setTimeout(hide,160)">
      <div id="res"></div>
    </div>
  </div>
</header>

<nav class="crumbs" id="crumbs" hidden><div class="wrap" id="crumbsIn"></div></nav>
<main class="wrap" id="app"></main>

<script>
/* ══════════════════════════════════════════════════════════
   BASE DE DONNÉES

const DB = {

automates:[

],

  {id:'verin',nom:'Vérins',note:'Électriques et pneumatiques',actif:false},

 ],
 camera:[],variateur:[],ihm:[]
},

marques:[
  {id:'ifm',nom:'ifm electronic',note:'Documentation en accès libre',actif:true},
  {id:'keyence',nom:'KEYENCE',note:'Radar 60 GHz, afficheur intégré',actif:true},
  {id:'siemens-c',nom:'Siemens',note:'SIRIUS — signalisation et commande',actif:true},
  {id:'sick',nom:'SICK',note:'',actif:false},
  {id:'balluff',nom:'Balluff',note:'',actif:false}
],

/* ── LE CHOIX QUI MANQUAIT : comment l'appareil est raccordé ── */
modes:[
  {id:'iolink',nom:'IO-Link',note:'Via un maître IO-Link — données numériques, paramétrage à distance'},
  {id:'analogique',nom:'Analogique',note:'Boucle 4-20 mA sur carte d\u2019entrées analogiques'},
  {id:'tor',nom:'Tout ou rien',note:'Sorties de commutation sur carte d\u2019entrées TOR'},
  {id:'conventionnel',nom:'Câblage 24 V',note:'Un fil par segment, paramétrage préalable par USB'}
],

maitres:[
  {id:'al1102',marque:'ifm',ref:'AL1102',protocole:'PROFINET',ports:8,classe:'A',

],

/* Procédures : écrites une fois, réutilisées par tous les appareils du même mode */
procedures:{
 'iolink-profinet':{
   nom:'IO-Link via un maître PROFINET',
   etapes:[
     {t:'Télécharger le GSDML du maître',d:'Le constructeur du maître fournit le fichier GSD qui décrit l\u2019appareil, ses paramètres et ses données process.'},

     {t:'Insérer le maître dans le projet',d:'Le maître apparaît dans le catalogue après installation. Le glisser dans la vue réseau et l\u2019affecter au système PROFINET de la CPU.'},
     {t:'Déclarer les ports',d:'Glisser le module correspondant au nombre de ports sur le slot 1 du maître. La configuration devient accessible via le slot 1.1.'},
     {t:'Récupérer et installer l\u2019IODD du capteur',d:'L\u2019IODD décrit le capteur : paramètres, données process, plages. Source officielle : IODDfinder. Prendre la version correspondant au firmware.'},

     {t:'Relever la plage d\u2019adresses',d:'TIA attribue automatiquement une plage d\u2019entrées au port. C\u2019est la base de tout l\u2019adressage dans le programme.'}
   ]},
 'iolink-s7pct':{
   nom:'IO-Link en sortie, via S7 Port Configuration Tool',
   etapes:[
     {t:'Installer S7-PCT',d:'Le S7 Port Configuration Tool est un logiciel séparé, téléchargeable chez Siemens. Redémarrer TIA Portal après l\u2019installation, sinon l\u2019outil n\u2019apparaît pas.'},
     {t:'Configurer la CPU et la périphérie décentralisée',d:'Ajouter la CPU, puis la station ET 200SP dans la vue réseau, et l\u2019affecter comme périphérique du système PROFINET.'},
     {t:'Ajouter le module maître IO-Link',d:'Depuis le catalogue matériel : modules de communication → maître IO-Link → CM 4xIO-Link. Il se place dans le rack de l\u2019ET 200SP.'},
     {t:'Ouvrir S7-PCT depuis TIA',d:'Clic droit sur le module maître dans la vue appareil, puis « Démarrer l\u2019outil d\u2019appareil ». S7-PCT s\u2019ouvre avec son propre catalogue.'},
     {t:'Affecter l\u2019appareil à un port',d:'Dans le catalogue S7-PCT : IO Link V1.1 → Siemens AG → SIRIUS signaling columns → le modèle exact. Glisser sur le port voulu.'},
     {t:'Paramétrer en acyclique',d:'Sous « Parameters », régler le mode de signal, le nombre de niveaux, puis pour chaque segment l\u2019effet lumineux, la couleur par défaut, la luminosité et les quotients RVB.'},
     {t:'Charger dans les appareils',d:'Clic droit sur le maître → « Charger avec les appareils ». La configuration part vers le maître ET vers l\u2019appareil. Étape distincte du chargement du programme CPU.'},
     {t:'Relever la plage d\u2019adresses de sortie',d:'S7-PCT indique les sorties numériques attribuées. C\u2019est le mot source des données process optiques à raccorder dans le programme.'}
   ]},
 'analogique-ai':{
   nom:'Boucle de courant sur carte d\u2019entrées analogiques',
   etapes:[
     {t:'Choisir la carte d\u2019entrées analogiques',d:'Un module AI acceptant le courant — par exemple AI 8xU/I HS sur S7-1500, ou les entrées analogiques intégrées d\u2019une CPU compacte 1512C.'},
     {t:'Câbler la boucle de courant',d:'Deux fils vers l\u2019entrée courant du module. Respecter la résistance de charge maximale annoncée par le capteur, sinon la boucle décroche en haut d\u2019échelle.'},
     {t:'Déclarer le module dans la configuration matérielle',d:'Insérer le module dans le rack, puis choisir le type de mesure « Courant (transducteur à 4 fils) » et la plage 4…20 mA dans ses propriétés.'},
     {t:'Relever l\u2019adresse d\u2019entrée',d:'TIA attribue un mot d\u2019entrée par voie. C\u2019est cette adresse qui sera lue dans le programme.'},
     {t:'Mettre à l\u2019échelle',d:'Sur S7-1500, la plage 4…20 mA correspond à une valeur brute de 0 à 27648. NORM_X ramène à 0,0…1,0 puis SCALE_X convertit vers la grandeur physique.'},
     {t:'Traiter les dépassements',d:'Sous 4 mA et au-delà de 20 mA, le module remonte des valeurs de dépassement. Les filtrer avant affichage, sinon la supervision affiche n\u2019importe quoi.'}
   ]},
 'tor-di':{

     {t:'Choisir la carte d\u2019entrées',d:'Module DI 24 V DC. Vérifier le courant absorbé par voie et la compatibilité avec la tension résiduelle du capteur.'},
     {t:'Câbler les sorties de commande',d:'Un fil par sortie utilisée vers une voie du module. Isoler individuellement toutes les sorties non utilisées.'},
     {t:'Régler les seuils sur le capteur',d:'Les seuils de commutation ne se règlent pas dans TIA : ils se saisissent sur l\u2019afficheur du capteur, ou par IO-Link.'},
     {t:'Déclarer le module et relever les adresses',d:'Chaque sortie devient un bit d\u2019entrée dans le programme. Rien à convertir.'}
   ]}
},

/* ── Familles IODD : une IODD couvre plusieurs appareils ──
   Découvert en comparant les trois fichiers KEYENCE : structure
   rigoureusement identique, à deux libellés près. ── */
famillesIodd:{
 'keyence-fr':{
  nom:'KEYENCE série FR',
  trame:{octets:12,bits:96},
  donnees:[
   {cle:'val',nom:'Valeur actuelle',bitOffset:64,bits:32,type:'INT 32',octets:[0,1,2,3],

   {cle:'cum',nom:'@VAL2@',bitOffset:32,bits:32,type:'INT 32',octets:[4,5,6,7],

   {cle:'sta',nom:'Stabilité + couleur',bitOffset:8,bits:8,type:'2 × UINT 4',octets:[10],couleur:'#6E4FA0'},

  bitsDiag:[
   ['8','31','LOW — niveau sous la plage de mesure'],
   ['8','30','HIGH — niveau au-dessus de la plage'],
   ['8','29','Tracking — suivi en cours, valeur maintenue'],
   ['8','28','@BIT28@'],
   ['8','27','Stabilité dégradée — alerte de maintenance'],
   ['8','26','Mesure impossible'],
   ['8','25','Erreur d\u2019apprentissage'],
   ['8','24','Interférence — autre source 60 GHz à proximité'],
   ['9','23','Erreur de tête de capteur'],
   ['9','22 → 18','Surintensité sur les sorties 5 à 1'],
   ['9','17','Erreur EEPROM'],
   ['9','16','Erreur système'],
   ['10','15 → 12','Stabilité — 0 (détection impossible) à 4 (signal franc)'],
   ['10','11 → 8','Couleur de l\u2019indicateur — 0 éteint · 1 vert · 2 jaune · 3 rouge · 4 rouge clignotant'],

  ],
  avertissementIodd:{

   d:'Les trois IODD de la gamme annoncent un M12 4 broches avec C/Q en broche 4, fil noir. Ce sont les couleurs standard DIN EN 60947-5-2, pas celles du câble réel — le faisceau ne contient aucun fil noir. Règle générale : l\u2019IODD sert aux données process et aux paramètres, jamais au câblage. Pour le câblage, c\u2019est la notice constructeur.'
  },
  sansGradient:{
   t:'La valeur actuelle n\u2019a pas de facteur d\u2019échelle',

  }
 }
},

appareils:[

/* ─────────────── ifm LDH292 ─────────────── */
{

let S={automate:null,categorie:null,type:null,marque:null,modele:null,mode:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const find=(c,id)=>DB[c].find(x=>x.id===id)||{};
const sousTypes=cat=>DB.sousTypes[cat]||[];
const findType=id=>{for(const k in DB.sousTypes){const t=DB.sousTypes[k].find(x=>x.id===id);if(t)return t}return{}};
const dev=id=>DB.appareils.find(x=>x.id===id);

function go(v,val){
  if(v==='home')S={automate:null,categorie:null,type:null,marque:null,modele:null,mode:null};
  if(v==='categorie')S.automate=val;
  if(v==='type')S.categorie=val;
  if(v==='marque')S.type=val;
  if(v==='modele')S.marque=val;
  if(v==='mode')S.modele=val;
  if(v==='guide')S.mode=val;
  window.scrollTo(0,0);render(v);
}
const goCat=v=>go('categorie',v),goType=v=>go('type',v),goMarque=v=>go('marque',v),
      goModele=v=>go('modele',v),goMode=v=>go('mode',v),goGuide=v=>go('guide',v);
const back=v=>`<button class="back" onclick="go('${v}')">← Retour</button>`;

function crumbs(items){
  const c=$('crumbs');
  if(!items.length){c.hidden=true;return}
  c.hidden=false;
  $('crumbsIn').innerHTML=items.map((it,i)=>
    (i?'<span class="sep">›</span>':'')+
    (it.vue?`<button onclick="go('${it.vue}')">${esc(it.txt)}</button>`:`<span class="now">${esc(it.txt)}</span>`)
  ).join('');
}
function tiles(list,fn,topId){
  return `<div class="grid">${list.map(x=>{
    const on=x.actif!==false, top=topId&&x.id===topId;
    return `<button class="tile${top?' top':''}" ${on?`onclick="${fn}('${x.id}')"`:'disabled'}>
      <h3>${esc(x.nom)}</h3>${x.note?`<p>${esc(x.note)}</p>`:''}
      <span class="badge">${top?'Le plus consulté':(on?'Disponible':'Bientôt')}</span></button>`;
  }).join('')}</div>`;
}
const head=(s,t,l)=>`<span class="step">${esc(s)}</span><h1 class="title">${esc(t)}</h1>${l?`<p class="lede">${esc(l)}</p>`:''}`;

function render(v){
  const app=$('app'), a=find('automates',S.automate), c=find('categories',S.categorie),
        t=findType(S.type), m=find('marques',S.marque);

  if(v==='home'){
    crumbs([]);
    app.innerHTML=head('Étape 1 sur 7','Quel automate ?',
      'Le guide descend jusqu\u2019au matériel exact et jusqu\u2019à son mode de raccordement : câblage, réglages sur l\u2019appareil, intégration TIA Portal, programmation.')
      +tiles(DB.automates,'goCat')+modelNote();return;
  }
  if(v==='categorie'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom}]);
    app.innerHTML=back('home')+head('Étape 2 sur 7',a.nom+' — quel matériel ?','')+tiles(DB.categories,'goType');return;
  }
  if(v==='type'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom}]);
    const estCapteur=S.categorie==='capteur';
    app.innerHTML=back('categorie')+head('Étape 3 sur 7',
      estCapteur?'Quelle grandeur mesurée ?':'Quelle fonction ?',
      estCapteur
        ?'On classe par ce qui est mesuré, pas par la technologie — un niveau se mesure au radar, à l\u2019ultrason ou en capacitif.'
        :'Un actionneur ne mesure rien : on le classe par ce qu\u2019il fait.')
      +tiles(sousTypes(S.categorie),'goMarque');return;
  }
  if(v==='marque'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},{txt:t.nom}]);
    const top={niveau:'keyence',temperature:'ifm',signalisation:'siemens-c'}[S.type];
    app.innerHTML=back('type')+head('Étape 4 sur 7','Quelle marque ?','')+tiles(DB.marques,'goModele',top);return;
  }
  if(v==='modele'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},{txt:t.nom,vue:'marque'},{txt:m.nom}]);
    const l=DB.appareils.filter(d=>d.marque===S.marque&&d.type===S.type&&d.categorie===S.categorie)
      .map(d=>({id:d.id,nom:d.ref,note:d.nom+' — '+d.techno,actif:true}));
    app.innerHTML=back('marque')+head('Étape 5 sur 7','Quel modèle ?','')
      +(l.length?tiles(l,'goMode',l[0].id):`<div class="note"><b>Aucun appareil</b>Cette combinaison n\u2019est pas encore documentée.</div>`);return;
  }
  if(v==='mode'){
    const d=dev(S.modele);
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},
            {txt:t.nom,vue:'marque'},{txt:m.nom,vue:'modele'},{txt:d.ref}]);
    const dispo=DB.modes.filter(x=>d.raccordements[x.id]).map(x=>({...x,actif:true}));
    const absents=DB.modes.filter(x=>!d.raccordements[x.id]).map(x=>({...x,actif:false,note:'Non supporté par cet appareil'}));
    app.innerHTML=back('modele')+head('Étape 6 sur 7','Comment le raccordez-vous ?',
      'C\u2019est ce choix qui détermine la procédure. Un même capteur en IO-Link ou en 4-20 mA n\u2019a rien de commun côté TIA Portal.')
      +tiles(dispo.concat(absents),'goGuide',dispo[0]&&dispo[0].id);return;
  }
  if(v==='guide')guide();
}

function modelNote(){
  return `<div class="model-note"><b>Comment cette maquette fonctionne</b>
  Aucune page n\u2019est écrite à la main. Chaque guide est assemblé à partir de quatre sources :
  la <strong>procédure du mode de raccordement</strong> (écrite une seule fois et partagée par tous les
  appareils), les <strong>caractéristiques de l\u2019appareil</strong>, son <strong>brochage</strong> — qui n\u2019est
  jamais générique — et, en IO-Link, la <strong>structure des données process</strong> lue dans son IODD.
  Le schéma d\u2019octets, la table de brochage et le code sont générés depuis ces données.</div>`;
}

/* Fusionne la famille IODD dans le raccordement de l'appareil.
   C'est ce qui permet d'ajouter un capteur de la même gamme
   en quelques lignes de données, sans dupliquer la trame. */
function rac(d,mode){
  const r=d.raccordements[mode];
  if(!r||!r.familleIodd) return r;
  const F=DB.famillesIodd[r.familleIodd], v=r.variante||{};
  const sub=t=>String(t).replace('@VAL2@',v.val2||'—').replace('@BIT28@',v.bit28||'—');
  return Object.assign({},r,{
    famille:F.nom,
    trame:F.trame,
    donnees:F.donnees.map(x=>Object.assign({},x,{nom:sub(x.nom)})),
    bitsDiag:F.bitsDiag.map(b=>[b[0],b[1],sub(b[2])]),
    avertissementIodd:F.avertissementIodd,
    sansGradient:F.sansGradient
  });
}

function guide(){
  const d=dev(S.modele), r=rac(d,S.mode), md=DB.modes.find(x=>x.id===S.mode),
        proc=DB.procedures[r.procedure], mt=r.maitre?DB.maitres.find(x=>x.id===r.maitre):null,
        a=S.automate?find('automates',S.automate):find('automates','siemens');
  let n=0;const num=()=>String(++n).padStart(2,'0');
  const P=[];

  P.push(`<div class="guide-head">
    <span class="step">Guide d\u2019intégration</span>
    <h1 class="title">${esc(d.ref)} — raccordement ${esc(md.nom)}</h1>

      ${mt?`<span class="chip">${esc(mt.marque)} ${esc(mt.ref)}</span>`:''}
      <span class="chip mode">${esc(md.nom)}</span>
      <span class="chip alt">${esc(a.nom)}</span>
      <span class="chip alt">${esc(d.techno)}</span>
      ${r.sens==='sortie'?'<span class="chip alt" style="border-color:var(--signal);color:var(--signal-deep)">Données en sortie</span>':''}
    </div></div>`);

  /* 1 — caractéristiques */
  P.push(`<section class="blk"><h2 data-n="${num()}">Caractéristiques de l\u2019appareil</h2>
   <table><tbody>${d.specs.map(s=>`<tr><th style="width:33%">${s[0]}</th><td>${s[1]}</td></tr>`).join('')}</tbody></table>
   ${mt?`<div class="note"><b>Compatibilité</b>Le ${esc(mt.ref)} dispose de ${mt.ports} ports classe ${esc(mt.classe)} et gère IO-Link ${esc(mt.specIolink)} — compatible.</div>`:''}
   </section>`);

  /* 2 — câblage */
  P.push(`<section class="blk"><h2 data-n="${num()}">Câblage</h2>
   <p style="margin:0 0 14px;color:var(--ink-2);font-size:13.5px">${esc(r.connecteur)} — ${esc(r.cable)}</p>
   <div class="pins">${connSvg(r)}
   <table><thead><tr><th>Broche</th><th>Fil</th><th>Fonction</th></tr></thead><tbody>
   ${r.pinout.map(p=>`<tr><td class="num">${p.n}</td>
     <td><span class="dot" style="background:${p.hex}"></span><span class="m">${p.coul}</span> ${p.nom}</td>
     <td>${esc(p.fn)}</td></tr>`).join('')}</tbody></table></div>
   ${r.bornier?`<div class="note info"><b>Côté maître IO-Link</b>
     Affectation des bornes sur la BaseUnit du module : ${r.bornier.map(b=>`<span class="mono">${b[0]}</span> ${esc(b[1])}`).join(' · ')}</div>`:''}
   ${r.noteMode?`<div class="note info"><b>Version conventionnelle</b>${esc(r.noteMode)}</div>`:''}
   ${S.mode==='iolink'?`<div class="note info"><b>Une liaison IO-Link n\u2019utilise que 4 conducteurs</b>
     L\u2019alimentation, le 0 V, la ligne de communication C/Q, et un quatrième non utilisé en classe A.
     Peu importe que le connecteur en compte 8 : les autres fils restent inutilisés et doivent être isolés individuellement.</div>`:''}
   ${r.pinoutComplement?`<div class="note info"><b>Autres broches du connecteur</b>
     ${r.pinoutComplement.map(x=>`<span class="m">${x[0]}</span> ${x[1]} — ${esc(x[2])}`).join(' · ')}
     <br>Isoler individuellement tous les fils non utilisés.</div>`:''}
   ${S.mode==='iolink'&&d.id==='fr-s01'?`<div class="note warn"><b>La règle « IO-Link = broche 4 » ne s\u2019applique pas ici</b>
     Connecteur 8 broches propriétaire : la communication passe par la <span class="m">broche 6</span>, fil rose.
     Vérifiez toujours le brochage du fabricant plutôt que de vous fier à l\u2019habitude.</div>`:''}
   </section>`);

  /* 3 — réglages sur l'appareil */
  if(d.reglagesAppareil){
    const g=d.reglagesAppareil;
    P.push(`<section class="blk"><h2 data-n="${num()}">Réglages sur l\u2019appareil</h2>
     <p style="margin:0 0 14px;color:var(--ink-2);font-size:13.5px">${esc(g.intro)}</p>
     <table><thead><tr><th style="width:32%">Étape de l\u2019assistant</th><th>Options</th></tr></thead>
     <tbody>${g.etapes.map(e=>`<tr><th>${e[0]}</th><td>${e[1]}</td></tr>`).join('')}</tbody></table>
     <div class="note info"><b>Après l\u2019assistant</b>${esc(g.apres)}</div></section>`);

  P.push(`<section class="blk"><h2 data-n="${num()}">Intégration dans TIA Portal</h2>

  if(r.commande) P.push(blocCommande(r,num));
  if(S.mode==='iolink'&&r.donnees) P.push(blocIolink(r,num));
  if(S.mode==='analogique') P.push(blocAnalog(r,num));

  /* 6 — programmation */
  if(S.mode==='iolink'&&r.donnees&&!r.commande) P.push(r.familleIodd==='keyence-fr'

/* ── connecteur dessiné selon le nombre de broches ── */
function connSvg(r){
  const huit=/8/.test(r.connecteur);
  if(!huit){
    const c={};r.pinout.forEach(p=>c[p.n]=p.hex);
    return `<svg viewBox="0 0 120 120" aria-label="Brochage M12 4 broches"><circle cx="60" cy="60" r="44" fill="none" stroke="#141A20" stroke-width="2.5"/>
    <circle cx="60" cy="38" r="7" fill="${c[1]||'#fff'}" stroke="#141A20" stroke-width="1.5"/>
    <circle cx="38" cy="60" r="7" fill="${c[2]||'#fff'}" stroke="#141A20" stroke-width="1.5"/>
    <circle cx="82" cy="60" r="7" fill="${c[4]||'#fff'}" stroke="#141A20" stroke-width="1.5"/>
    <circle cx="60" cy="82" r="7" fill="${c[3]||'#fff'}" stroke="#141A20" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">1</text>
    <text x="20" y="64" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">2</text>
    <text x="100" y="64" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">4</text>
    <text x="60" y="110" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">3</text></svg>`;
  }
  const c={};r.pinout.forEach(p=>c[p.n]=p.hex);
  const pos=[[60,32],[38,44],[38,70],[60,84],[82,70],[82,44],[60,58],[46,58]];
  const lbl=[[60,16],[22,44],[22,76],[60,104],[100,76],[100,44],[74,58],[32,58]];
  let s=`<svg viewBox="0 0 120 120" aria-label="Brochage M12 8 broches"><circle cx="60" cy="60" r="46" fill="none" stroke="#141A20" stroke-width="2.5"/>`;
  for(let i=0;i<8;i++){
    s+=`<circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="6" fill="${c[i+1]||'#EDEEEA'}" stroke="#141A20" stroke-width="1.4"/>`;
    s+=`<text x="${lbl[i][0]}" y="${lbl[i][1]+4}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10">${i+1}</text>`;
  }
  return s+'</svg>';
}

/* ── bloc données process IO-Link ── */
function blocIolink(r,num){
  const N=r.trame.octets, cols=`grid-template-columns:repeat(${N},1fr)`;
  const cells=Array.from({length:N},()=>null);
  r.donnees.forEach(x=>x.octets.forEach((o,i)=>{
    cells[o]={coul:x.couleur,txt:x.octets.length>1?`${x.nom}<br>${i===0?'MSB':(i===x.octets.length-1?'LSB':'·')}`:x.nom};
  }));
  const strip=cells.map(c=>c
    ?`<div class="byte" style="background:${c.coul};color:#fff">${c.txt}</div>`
    :`<div class="byte nil">—</div>`).join('');

  let h=`<section class="blk"><h2 data-n="${num()}">Structure des données process</h2>`;
  if(r.iodd){
    h+=`<table style="margin-bottom:18px"><tbody>
      <tr><th style="width:33%">Fichier IODD</th><td class="mono">${esc(r.iodd.fichier)}</td></tr>
      <tr><th>Version · date</th><td>${esc(r.iodd.version)} — ${esc(r.iodd.date)}</td></tr>
      <tr><th>VendorID · DeviceID</th><td class="mono">${esc(r.iodd.vendorId)} · ${esc(r.iodd.deviceId)}</td></tr>
      <tr><th>Variantes couvertes</th><td>${esc(r.iodd.variantes)}</td></tr>
      ${r.famille?`<tr><th>Famille IODD</th><td>${esc(r.famille)} — structure de données process commune à toute la gamme</td></tr>`:''}
      <tr><th>Data Storage</th><td>${r.iodd.dataStorage
        ?'✅ Pris en charge — le maître sauvegarde le paramétrage. Un capteur remplacé est reconfiguré automatiquement.'
        :'Non pris en charge'}</td></tr>
      </tbody></table>`;
  }
  if(r.avertissementIodd)
    h+=`<div class="note warn"><b>${esc(r.avertissementIodd.t)}</b>${esc(r.avertissementIodd.d)}</div>`;

  h+=`<div class="frame-caption" style="margin-top:18px">${r.trame.bits} bits — ${N} octets${
      cells.includes(null)?' — les zones hachurées ne sont pas utilisées':''}</div>
   <div class="bytes" style="${cols}">${strip}</div>
   <div class="ruler" style="${cols}">${Array.from({length:N},(_,i)=>`<div class="tick">${i}</div>`).join('')}</div>
   <div class="legend">${r.donnees.map(x=>
     `<span><i style="background:${x.couleur}"></i>${esc(x.nom)} — octet${x.octets.length>1?'s':''} ${
      x.octets.length>1?x.octets[0]+'-'+x.octets[x.octets.length-1]:x.octets[0]}</span>`).join('')}
     ${cells.includes(null)?'<span><i style="background:var(--card-2);border:1px solid var(--line)"></i>Inutilisé</span>':''}</div>

   <table style="margin-top:20px"><thead><tr><th>Donnée</th><th>Offset bit</th><th>Longueur</th><th>Type</th><th>Plage brute</th><th>Conversion</th></tr></thead>
   <tbody>${r.donnees.map(x=>`<tr><td>${esc(x.nom)}</td><td class="num">${x.bitOffset}</td>
     <td class="num">${x.bits} bits</td><td class="num">${esc(x.type)}</td>
     <td class="num">${x.min!==undefined?x.min+' … '+x.max:'—'}</td>
     <td class="num">${x.gradient?'÷ 10 → '+x.unite:(x.unite?esc(x.unite):'bits d\u2019état')}</td></tr>`).join('')}</tbody></table>`;

  if(r.sansGradient)
    h+=`<div class="note warn"><b>${esc(r.sansGradient.t)}</b>${esc(r.sansGradient.d)}</div>`;
  else
    h+=`<div class="note info"><b>Exemple de lecture</b>Valeur brute 435 sur les octets 0-1 → <span class="m">43,5 % RH</span>. Valeur brute −85 sur les octets 4-5 → <span class="m">−8,5 °C</span>.</div>`;

  if(r.bitsDiag){
    h+=`<h2 data-n="${num()}" style="margin-top:28px">Bits de diagnostic</h2>
     <p style="margin:0 0 12px;color:var(--ink-2);font-size:13.5px">
     Tout ce que le capteur affiche à l\u2019écran remonte en cyclique. Aucune lecture acyclique n\u2019est
     nécessaire pour construire une supervision complète.</p>
     <table><thead><tr><th style="width:70px">Octet</th><th style="width:90px">Bit</th><th>Signification</th></tr></thead>
     <tbody>${r.bitsDiag.map(b=>`<tr><td class="num">${b[0]}</td><td class="num">${b[1]}</td><td>${esc(b[2])}</td></tr>`).join('')}</tbody></table>`;
  }
  if(r.valeursSpeciales){
    h+=`<h2 data-n="${num()}" style="margin-top:28px">Valeurs spéciales à filtrer</h2>
     <table><thead><tr><th>Valeur brute</th><th>Signification</th><th>Concerne</th></tr></thead>
     <tbody>${r.valeursSpeciales.map(v=>`<tr><td class="num">${v[0]}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td></tr>`).join('')}</tbody></table>`;
  }
  if(r.deviceStatus){
    h+=`<h2 data-n="${num()}" style="margin-top:28px">Device status</h2>
     <table><tbody>${r.deviceStatus.map(v=>`<tr><th style="width:90px" class="num">${v[0]}</th><td>${esc(v[1])}</td></tr>`).join('')}</tbody></table>
     <div class="note info"><b>Maintenance conditionnelle</b>Copie du paramètre index 36 dans le canal cyclique : exploitable sans lecture acyclique.</div>`;
  }
  return h+'</section>';
}


/* ── bloc commande : appareils dont les données process sont en SORTIE ── */
function blocCommande(r,num){
  const C=r.commande;
  let h=`<section class="blk"><h2 data-n="${num()}">Piloter l\u2019appareil</h2>
   <div class="note info"><b>Sens des données : sortie</b>
     Contrairement à un capteur, l\u2019automate <strong>écrit</strong> vers cet appareil.
     Il n\u2019y a pas de trame d\u2019octets à décoder : Siemens fournit un bloc fonction qui
     encapsule la communication IO-Link.</div>
   <table style="margin-top:16px"><tbody>
     <tr><th style="width:33%">Bloc fonction</th><td class="mono">${esc(C.bloc)}</td></tr>
     <tr><th>Où le trouver</th><td>${esc(C.blocNote)}</td></tr>
   </tbody></table>
   <h2 data-n="${num()}" style="margin-top:26px">Interface du bloc</h2>
   <table><thead><tr><th style="width:26%">Entrée</th><th style="width:22%">Type</th><th>Rôle</th></tr></thead>
   <tbody>${C.entrees.map(e=>`<tr><td class="mono">${esc(e[0])}</td><td class="mono">${esc(e[1])}</td><td>${esc(e[2])}</td></tr>`).join('')}</tbody></table>
   <table style="margin-top:12px"><thead><tr><th style="width:26%">Sortie</th><th style="width:22%"></th><th>Rôle</th></tr></thead>
   <tbody>${C.sorties.map(e=>`<tr><td class="mono">${esc(e[0])}</td><td class="mono">${esc(e[1])}</td><td>${esc(e[2])}</td></tr>`).join('')}</tbody></table>
   <h2 data-n="${num()}" style="margin-top:26px">Valeurs à envoyer</h2>
   <p style="margin:0 0 12px;color:var(--ink-2);font-size:13.5px">
     Pour chacun des cinq segments, un DInt de couleur et un DInt d\u2019effet.</p>
   <div class="pins">
   <table style="min-width:230px"><thead><tr><th>Couleur</th><th>Signification</th></tr></thead>
   <tbody>${C.couleurs.map(v=>`<tr><td class="num">${v[0]}</td><td>${esc(v[1])}</td></tr>`).join('')}</tbody></table>
   <table style="min-width:230px"><thead><tr><th>Effet</th><th>Signification</th></tr></thead>
   <tbody>${C.effets.map(v=>`<tr><td class="num">${v[0]}</td><td>${esc(v[1])}</td></tr>`).join('')}</tbody></table>
   </div>
   <div class="note warn"><b>Cinq segments maximum en mode Autoscale</b>
     Les segments 1 à 5 se règlent par <span class="mono">colorSegmentN</span> et
     <span class="mono">effectSegmentN</span>. Mettre l\u2019effet à 0 éteint le segment.
     Pour utiliser moins de couleurs, on ne renseigne que les premiers segments et on laisse
     les autres à 0.</div>
   </section>`;
  return h;
}

/* ── bloc analogique ── */
function blocAnalog(r,num){
  const A=r.analog;
  return `<section class="blk"><h2 data-n="${num()}">La boucle de courant</h2>
   <table><tbody>
    <tr><th style="width:33%">Plage</th><td>${esc(A.plage)}</td></tr>
    <tr><th>Résistance de charge</th><td>${esc(A.charge)}</td></tr>
    <tr><th>Résolution</th><td>${esc(A.resolution)}</td></tr>
    <tr><th>Précision au zéro</th><td>${esc(A.precisionZero)}</td></tr>
    <tr><th>Précision pleine échelle</th><td>${esc(A.precisionPE)}</td></tr>
    <tr><th>Temps de réponse</th><td>${esc(A.tempsReponse)}</td></tr>
   </tbody></table>
   <h2 data-n="${num()}" style="margin-top:26px">Correspondance niveau → courant</h2>
   <p style="margin:0 0 12px;color:var(--ink-2);font-size:13.5px">Exemple pour un réservoir de 1000 mm, capteur installé 100 mm au-dessus du bord haut.</p>
   <table><thead><tr><th>Situation</th><th>Niveau</th><th>Sortie</th></tr></thead>
   <tbody>${A.exemple.map(e=>`<tr><td>${esc(e[0])}</td><td class="num">${e[1]}</td><td class="num">${e[2]}</td></tr>`).join('')}</tbody></table>
   <div class="note warn"><b>Hors plage et perte de détection</b>${esc(A.hors)}</div>
   <div class="note info"><b>Pas d\u2019IODD, pas de GSDML, pas de maître</b>
     En analogique, toute la chaîne IO-Link disparaît. Le capteur devient une simple source de courant :
     c\u2019est plus simple à mettre en œuvre, mais on perd le diagnostic, le paramétrage à distance et la valeur d\u2019état.</div>
   </section>`;
}

/* ── bloc TOR ── */
function blocTor(r,num){
  const T=r.tor;
  return `<section class="blk"><h2 data-n="${num()}">Les sorties de commutation</h2>
   <table><tbody>
    <tr><th style="width:33%">Type</th><td>${esc(T.type)}</td></tr>
    <tr><th>Limites électriques</th><td>${esc(T.limites)}</td></tr>
    <tr><th>Logique</th><td>${esc(T.logique)}</td></tr>
   </tbody></table>
   <h2 data-n="${num()}" style="margin-top:26px">Modes de sortie disponibles</h2>
   <table><tbody>${T.modes.map(m=>`<tr><th style="width:27%">${esc(m[0])}</th><td>${esc(m[1])}</td></tr>`).join('')}</tbody></table>
   <div class="note warn"><b>Tout se règle sur le capteur</b>
     Les seuils, l\u2019hystérésis et la logique N.O./N.F. se saisissent sur l\u2019afficheur du capteur, pas dans TIA Portal.
     Côté automate, vous ne lisez que des bits. Aucune conversion, aucun bloc de calcul — mais aucune traçabilité
     du paramétrage dans le projet non plus.</div>
   </section>`;
}

/* ── bloc programmation à onglets ── */
function blocProg(scl,lad,num){
  return `<section class="blk"><h2 data-n="${num()}">Programmation</h2>
   <div class="tabs" role="tablist">
     <button class="tab on" onclick="lang('cont',this)">CONT — Ladder</button>
     <button class="tab" onclick="lang('scl',this)">SCL</button>
     <button class="tab" disabled>LOG</button><button class="tab" disabled>LIST</button>
   </div>
   <div class="lang on" id="lang-cont"><pre class="lad">${lad}</pre></div>
   <div class="lang" id="lang-scl"><pre>${scl}</pre></div>
   <div class="note info"><b>CONT ou SCL ?</b>La mise à l\u2019échelle est plus lisible en SCL.
     L\u2019usage courant est d\u2019écrire ce bloc en SCL et de l\u2019appeler depuis le programme CONT.
     La version CONT existe pour les sites où le SCL n\u2019est pas autorisé.</div>
   <div class="note warn"><b>Code non validé sur installation</b>Généré depuis la documentation. À confirmer sur matériel avant mise en production.</div>
   </section>`;
}
function lang(id,btn){
  document.querySelectorAll('.lang').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));
  $('lang-'+id).classList.add('on');btn.classList.add('on');
}

/* ── générateurs de code ── */
function codeSclIolink(d,r){
  const spec=r.valeursSpeciales.filter(v=>/Température|et/.test(v[2])).map(v=>v[0].replace('−','-')).join(', ');
  return `<span class="c">// Données process ${d.ref} — ${r.trame.octets} octets
// Octets 0-1 : humidité (INT, ×0,1 %RH) · 4-5 : température (INT, ×0,1 °C) · 7 : status</span>

<span class="k">FUNCTION_BLOCK</span> <span class="n">"FB_${d.ref}"</span>
<span class="k">VAR_INPUT</span>
    humRaw : INT; tempRaw : INT; statusRaw : BYTE;
<span class="k">END_VAR</span>
<span class="k">VAR_OUTPUT</span>
    humidite : REAL; temperature : REAL;
    humValide : BOOL; tempValide : BOOL;
    deviceStatus : USINT; maintenance : BOOL; defaillance : BOOL;
<span class="k">END_VAR</span>

<span class="k">BEGIN</span>
    <span class="k">IF</span> #humRaw = 32764 <span class="k">THEN</span>   <span class="c">// NoData</span>
        #humValide := FALSE; #humidite := 0.0;
    <span class="k">ELSE</span>
        #humValide := TRUE;  #humidite := INT_TO_REAL(#humRaw) / 10.0;
    <span class="k">END_IF</span>;

    <span class="k">CASE</span> #tempRaw <span class="k">OF</span>
        ${spec}:
            #tempValide := FALSE; #temperature := 0.0;
        <span class="k">ELSE</span>
            #tempValide := TRUE;  #temperature := INT_TO_REAL(#tempRaw) / 10.0;
    <span class="k">END_CASE</span>;

    #deviceStatus := BYTE_TO_USINT(SHR(IN := #statusRaw, N := 4)) <span class="k">AND</span> 16#0F;
    #maintenance  := (#deviceStatus &gt;= 1);
    #defaillance  := (#deviceStatus = 4);
<span class="k">END_FUNCTION_BLOCK</span>

<span class="c">// Valeurs aberrantes ? Inversion d'octets Siemens :
// humRaw := WORD_TO_INT(SWAP(INT_TO_WORD(humRaw)));</span>`;
}
function codeLadIolink(d,r){
  const spec=r.valeursSpeciales.filter(v=>/Température|et/.test(v[2])).map(v=>v[0].replace('−','-'));
  const cmp=(v,i)=>`      ┌─────────────┐
      │     <>      │
${i===0?'──────':'      '}┤     Int     ├${i===spec.length-1?'──────────( tempValide )':'──────'}
      │ IN1  tempRaw│
      │ IN2 ${String(v).padStart(7)} │
      └─────────────┘`;
  return `<span class="c">// Adresses à adapter à la plage attribuée à votre port.</span>

<span class="r">Réseau 1 — Humidité : donnée valide ?</span>
      ┌─────────────┐
      │     <>      │
──────┤     Int     ├──────────( humValide )
      │ IN1   humRaw│
      │ IN2    32764│  <span class="c">← NoData</span>
      └─────────────┘

<span class="r">Réseau 2 — Conversion humidité (÷ 10 → % RH)</span>
                ┌──────────┐    ┌──────────┐
   humValide    │   CONV   │    │   DIV    │
──────┤ ├───────┤ Int→Real ├────┤   Real   ├──( humidite )
                │IN  humRaw│    │IN2   10.0│
                └──────────┘    └──────────┘

<span class="r">Réseau 3 — Température : donnée valide ?</span>
<span class="c">   Les ${spec.length} valeurs spéciales sont testées en série : toutes doivent être fausses.</span>
${spec.map(cmp).join('\n')}

<span class="r">Réseau 4 — Conversion température (÷ 10 → °C)</span>
                ┌──────────┐    ┌──────────┐
   tempValide   │   CONV   │    │   DIV    │
──────┤ ├───────┤ Int→Real ├────┤   Real   ├──( temperature )
                │IN tempRaw│    │IN2   10.0│
                └──────────┘    └──────────┘

<span class="r">Réseau 5 — Device status : 4 bits de poids fort</span>
      ┌──────────────┐    ┌──────────────┐
      │     SHR      │    │     AND      │
──────┤     Byte     ├────┤     Byte     ├──( deviceStatus )
      │IN  statusRaw │    │IN2    16#0F  │
      │N          4  │    └──────────────┘
      └──────────────┘`;
}
function codeSclFRS(d,r){
  const v2=(r.variante&&r.variante.val2)||'seconde valeur';
  return `<span class="c">// ${d.ref} en IO-Link — 12 octets de données process
// 0-3 : valeur actuelle (INT 32)      4-7  : ${v2.toLowerCase()} (INT 32)
// 8   : diagnostics                   9    : erreurs
// 10  : stabilité + couleur           11   : état des sorties</span>

<span class="k">FUNCTION_BLOCK</span> <span class="n">"FB_FR_S01"</span>
<span class="k">VAR_INPUT</span>
    valeurBrute : DINT;   <span class="c">// octets 0-3</span>
    valeur2Brute: DINT;   <span class="c">// octets 4-7 — ${v2}</span>
    diag        : BYTE;   <span class="c">// octet 8</span>
    erreurs     : BYTE;   <span class="c">// octet 9</span>
    etat        : BYTE;   <span class="c">// octet 10</span>
    sorties     : BYTE;   <span class="c">// octet 11</span>
    decimales   : USINT := 0;  <span class="c">// ⚠ doit refléter le réglage FAIT SUR LE CAPTEUR</span>
<span class="k">END_VAR</span>
<span class="k">VAR_OUTPUT</span>
    niveau      : REAL;   <span class="c">// dans l'unité réglée sur l'appareil</span>
    mesureOK    : BOOL;
    niveauHaut  : BOOL;   <span class="c">// HIGH</span>
    niveauBas   : BOOL;   <span class="c">// LOW</span>
    stabilite   : USINT;  <span class="c">// 0 = perdu … 4 = signal franc</span>
    maintenance : BOOL;   <span class="c">// stabilité dégradée</span>
    interference: BOOL;   <span class="c">// autre source 60 GHz</span>
    defaut      : BOOL;   <span class="c">// erreur système / EEPROM / tête</span>
<span class="k">END_VAR</span>

<span class="k">BEGIN</span>
    <span class="c">// ---- Octet 8 : diagnostics ----</span>
    #niveauBas    := #diag.%X7;   <span class="c">// bit 31 — LOW</span>
    #niveauHaut   := #diag.%X6;   <span class="c">// bit 30 — HIGH</span>
    #maintenance  := #diag.%X3;   <span class="c">// bit 27 — stabilité dégradée</span>
    #interference := #diag.%X0;   <span class="c">// bit 24 — interférence 60 GHz</span>

    <span class="c">// ---- Octet 9 : erreurs bloquantes ----</span>
    #defaut := #erreurs.%X7 <span class="k">OR</span> #erreurs.%X1 <span class="k">OR</span> #erreurs.%X0;
                  <span class="c">// tête        EEPROM         système</span>

    <span class="c">// ---- Octet 10 : stabilité sur les 4 bits de poids fort ----</span>
    #stabilite := BYTE_TO_USINT(SHR(IN := #etat, N := 4)) <span class="k">AND</span> 16#0F;

    <span class="c">// ---- Mesure exploitable ? ----</span>
    #mesureOK := <span class="k">NOT</span> #diag.%X2 <span class="k">AND</span> <span class="k">NOT</span> #defaut;  <span class="c">// bit 26 = Not Measurable</span>

    <span class="c">// ---- Mise à l'échelle ----
    // ⚠ Aucun gradient dans l'IODD : l'échelle dépend des réglages
    //   « unité de distance » et « position du point décimal » saisis
    //   sur l'afficheur du capteur. 0 décimale → la brute est déjà l'unité.</span>
    <span class="k">IF</span> #mesureOK <span class="k">THEN</span>
        <span class="k">CASE</span> #decimales <span class="k">OF</span>
            0: #niveau := DINT_TO_REAL(#valeurBrute);
            1: #niveau := DINT_TO_REAL(#valeurBrute) / 10.0;
            2: #niveau := DINT_TO_REAL(#valeurBrute) / 100.0;
            3: #niveau := DINT_TO_REAL(#valeurBrute) / 1000.0;
            <span class="k">ELSE</span>
               #niveau := DINT_TO_REAL(#valeurBrute) / 10000.0;
        <span class="k">END_CASE</span>;
    <span class="k">ELSE</span>
        #niveau := 0.0;
    <span class="k">END_IF</span>;
<span class="k">END_FUNCTION_BLOCK</span>`;
}
function codeLadFRS(d,r){
  return `<span class="c">// ${d.ref} en IO-Link — adresses à adapter à la plage attribuée au port.</span>

<span class="r">Réseau 1 — Diagnostics (octet 8, lecture directe des bits)</span>
   diag.%X7
────┤ ├──────────────────────────────( niveauBas )      <span class="c">LOW</span>

   diag.%X6
────┤ ├──────────────────────────────( niveauHaut )     <span class="c">HIGH</span>

   diag.%X3
────┤ ├──────────────────────────────( maintenance )    <span class="c">stabilité dégradée</span>

   diag.%X0
────┤ ├──────────────────────────────( interference )   <span class="c">autre source 60 GHz</span>

<span class="r">Réseau 2 — Défaut bloquant (octet 9, trois bits en parallèle)</span>
   erreurs.%X7
────┤ ├──┬───────────────────────────( defaut )
   erreurs.%X1
─────┤ ├──┤
   erreurs.%X0
─────┤ ├──┘

<span class="r">Réseau 3 — Mesure exploitable ?</span>
   diag.%X2    defaut
────┤/├────────┤/├─────────────────( mesureOK )
  <span class="c">Not Measurable</span>

<span class="r">Réseau 4 — Stabilité : 4 bits de poids fort de l'octet 10</span>
      ┌──────────────┐    ┌──────────────┐
      │     SHR      │    │     AND      │
──────┤     Byte     ├────┤     Byte     ├───( stabilite )
      │IN       etat │    │IN2    16#0F  │
      │N           4 │    └──────────────┘
      └──────────────┘

<span class="r">Réseau 5 — Mise à l'échelle selon le réglage du capteur</span>
<span class="c">   ⚠ Le diviseur dépend de la « position du point décimal » réglée
   sur l'afficheur. Ici : 1 décimale → division par 10.</span>
              ┌──────────────┐    ┌──────────┐
   mesureOK   │     CONV     │    │   DIV    │
──────┤ ├─────┤ DInt →  Real ├────┤   Real   ├───( niveau )
              │IN valeurBrute│    │IN2   10.0│
              └──────────────┘    └──────────┘`;
}
function codeSclAnalog(d){
  return `<span class="c">// ${d.ref} — boucle 4-20 mA sur carte d'entrées analogiques S7-1500
// Plage 4…20 mA  →  valeur brute 0…27648
// Réservoir de référence : 0…1000 mm</span>

<span class="k">FUNCTION_BLOCK</span> <span class="n">"FB_${d.ref}_Analog"</span>
<span class="k">VAR_INPUT</span>
    brut     : INT;    <span class="c">// mot d'entrée du module AI</span>
    niveauMin : REAL := 0.0;      <span class="c">// mm à 4 mA</span>
    niveauMax : REAL := 1000.0;   <span class="c">// mm à 20 mA</span>
<span class="k">END_VAR</span>
<span class="k">VAR_OUTPUT</span>
    niveau  : REAL;    <span class="c">// mm</span>
    valide  : BOOL;
    depHaut : BOOL;
    depBas  : BOOL;
<span class="k">END_VAR</span>
<span class="k">VAR_TEMP</span> norm : REAL; <span class="k">END_VAR</span>

<span class="k">BEGIN</span>
    <span class="c">// ---- Dépassements : hors 0…27648, la mesure n'est plus valide ----</span>
    #depBas  := (#brut &lt; 0);
    #depHaut := (#brut &gt; 27648);
    #valide  := <span class="k">NOT</span> #depBas <span class="k">AND</span> <span class="k">NOT</span> #depHaut;

    <span class="k">IF</span> #valide <span class="k">THEN</span>
        #norm   := NORM_X(MIN := 0,   VALUE := #brut, MAX := 27648);
        #niveau := SCALE_X(MIN := #niveauMin, VALUE := #norm, MAX := #niveauMax);
    <span class="k">ELSE</span>
        #niveau := 0.0;
    <span class="k">END_IF</span>;
<span class="k">END_FUNCTION_BLOCK</span>

<span class="c">// Rappel : la perte de détection se paramètre SUR LE CAPTEUR
// (3,5 mA / 21,5 mA / maintien / valeur fixe). Choisir 3,5 mA rend
// le défaut détectable côté automate — 0 mA ne l'est pas si on est en 0-20 mA.</span>`;
}

  return `<span class="c">// ${d.ref} — boucle 4-20 mA. Adresse %IW à adapter au module AI.</span>

<span class="r">Réseau 1 — Dépassement bas ?</span>
      ┌──────────────┐
      │      &lt;       │
──────┤     Int      ├──────────( depBas )
      │IN1      brut │
      │IN2         0 │
      └──────────────┘

<span class="r">Réseau 2 — Dépassement haut ?</span>
      ┌──────────────┐
      │      &gt;       │
──────┤     Int      ├──────────( depHaut )
      │IN1      brut │

      └──────────────┘

<span class="r">Réseau 3 — Mesure valide (aucun dépassement)</span>
   depBas   depHaut
────┤/├───────┤/├─────────────( valide )

<span class="r">Réseau 4 — Mise à l'échelle 0…27648 → 0…1000 mm</span>

<span class="c">// NORM_X ramène la valeur brute entre 0,0 et 1,0.

/* ── recherche ── */
function search(q){
  const box=$('res');q=q.trim().toLowerCase();
  if(q.length<2){box.innerHTML='';return}
  const hits=DB.appareils.filter(d=>(d.ref+' '+d.nom+' '+d.marqueNom+' '+d.techno).toLowerCase().includes(q));
  box.innerHTML=hits.length
    ?`<div class="results">${hits.map(d=>`<button onmousedown="openRef('${d.id}')">
       <span class="ref">${esc(d.ref)}</span> — ${esc(d.marqueNom)}<br>
       <span class="sub">${esc(d.nom)}</span></button>`).join('')}</div>`
    :`<div class="results"><button disabled style="color:var(--ink-3)">Aucun appareil documenté pour « ${esc(q)} »</button></div>`;
}
function openRef(id){
  const d=dev(id);
  S={automate:'siemens',categorie:d.categorie,type:d.type,marque:d.marque,modele:id,mode:null};
  hide();$('q').value='';window.scrollTo(0,0);render('mode');
}
function hide(){$('res').innerHTML=''}

go('home');
</script>
