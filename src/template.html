</head>
<body>

<div class="topbar">
<header>
  <div class="wrap hbar">
    <button class="logo" onclick="go('home')"><img src="/assets/logo.png?v=__ASSET_V__" alt="IO Setup"></button>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Chercher une référence — ex. LDH292, FR-S01" autocomplete="off"
             oninput="search(this.value)" onblur="setTimeout(hide,160)">
      <div id="res"></div>
    </div>
  </div>
</header>

<nav class="crumbs" id="crumbs" hidden><div class="wrap" id="crumbsIn"></div></nav>
</div>
<main class="wrap" id="app"></main>

<footer class="site-footer"><div class="wrap">
  <a href="/mentions-legales/">Mentions légales · à propos · contact</a>
  <span>Une erreur sur une page ? <a href="mailto:georgesalexandre25@gmail.com">Signalez-la</a>.</span>
</div></footer>

<script src="/render.js?v=__ASSET_V__"></script>
<script>
/* ══════════════════════════════════════════════════════════
   BASE DE DONNÉES
   Une page = procédure (selon le mode) + données de l'appareil.
   ══════════════════════════════════════════════════════════ */

const DB = /*__DB_JSON__*/null/*__END_DB_JSON__*/;

/* ══════════════════════════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════════════════════════ */
let S={automate:null,categorie:null,type:null,marque:null,modele:null,mode:null,bloc:null,voie:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const find=(c,id)=>DB[c].find(x=>x.id===id)||{};
const sousTypes=cat=>DB.sousTypes[cat]||[];

/* Une tuile ne s'affiche que si au moins un appareil existe derrière —
   pas de « Bientôt » : ajouter un appareil = créer un fichier JSON,
   pas cocher une case ailleurs. Calculé une fois depuis DB.appareils. */
const usedCategories=new Set(DB.appareils.map(d=>d.categorie));
const usedTypes=new Set(DB.appareils.map(d=>d.categorie+'|'+d.type));
const usedMarques=new Set(DB.appareils.map(d=>d.categorie+'|'+d.type+'|'+d.marque));
const findType=id=>{for(const k in DB.sousTypes){const t=DB.sousTypes[k].find(x=>x.id===id);if(t)return t}return{}};
const dev=id=>DB.appareils.find(x=>x.id===id);

/* Chaque navigation qui rend une vue pousse une entrée d'historique
   ({v, S}) — c'est ce qui permet au bouton ← du navigateur de faire
   exactement la même chose que le bouton ← Retour du site (voir
   popstate plus bas), au lieu de quitter le site. */
function pushView(v){history.pushState({v:v,S:{...S}},'',location.pathname);}

function go(v,val){
  if(v==='home')S={automate:null,categorie:null,type:null,marque:null,modele:null,mode:null,voie:null};
  if(v==='categorie')S.automate=val;
  if(v==='type')S.categorie=val;
  if(v==='marque')S.type=val;
  if(v==='modele')S.marque=val;
  if(v==='mode')S.modele=val;
  if(v==='guide')S.mode=val;
  window.scrollTo(0,0);pushView(v);render(v);
}
const goCat=v=>go('categorie',v),goType=v=>go('type',v),goMarque=v=>go('marque',v),
      goModele=v=>go('modele',v),goMode=v=>go('mode',v);

/* IO-Link sur un capteur (jamais un actionneur, sens !== 'sortie') : une
   étape de plus avant le guide, quel maître IO-Link — le brochage ne
   change pas selon le maître, mais la procédure TIA Portal, si (voir
   DB.voiesIolink et Render.rac()). Tout autre mode va droit au guide,
   inchangé. */
function goGuide(mode){
  const d=dev(S.modele), r=d.raccordements[mode];
  if(mode==='iolink'&&r&&r.sens!=='sortie'&&DB.voiesIolink){
    S.mode=mode;S.voie=null;
    window.scrollTo(0,0);pushView('voie');render('voie');return;
  }
  go('guide',mode);
}
function goVoie(voieId){
  S.voie=voieId;
  window.scrollTo(0,0);pushView('guide');render('guide');
}

/* Blocs système : branche parallèle à la catégorie, indépendante de tout
   appareil — accessible juste après le choix de l'automate. */
function goBlocs(){window.scrollTo(0,0);pushView('blocsListe');render('blocsListe')}
function goBlocGuide(id){S.bloc=id;window.scrollTo(0,0);pushView('blocGuide');render('blocGuide')}

/* Retour/breadcrumb : ré-affiche une étape déjà visitée SANS toucher à S.
   go(v,val) sert à avancer (il enregistre val dans le champ d'état
   correspondant à l'étape précédente) — l'appeler sans val pour reculer
   écrasait ce champ avec undefined et cassait l'étape suivante.
   Utilisé par les liens du fil d'Ariane (sauter plusieurs étapes en
   arrière d'un coup) : pousse quand même une entrée d'historique, pour
   que le bouton ← du navigateur reste cohérent avec où on a cliqué. */
function backTo(v){window.scrollTo(0,0);pushView(v);render(v);}

/* Le bouton ← Retour appelle directement l'historique du navigateur
   plutôt que backTo(v) : les deux doivent faire exactement la même
   chose, autant que ce soit littéralement le même mécanisme. */
const back=v=>`<button class="back" onclick="history.back()">← Retour</button>`;

/* backView : vue vers laquelle pointe le bouton ← Retour, rendu ici
   pour rester dans la barre sticky plutôt que dans le contenu qui
   défile — voir .topbar dans styles.css. */
function crumbs(items,backView){
  const c=$('crumbs');
  if(!items.length&&!backView){c.hidden=true;return}
  c.hidden=false;
  $('crumbsIn').innerHTML=(backView?back(backView):'')+items.map((it,i)=>
    (i?'<span class="sep">›</span>':'')+
    (it.vue?`<button onclick="backTo('${it.vue}')">${esc(it.txt)}</button>`:`<span class="now">${esc(it.txt)}</span>`)
  ).join('');
}
function tiles(list,fn,topId){
  return `<div class="grid">${list.map(x=>{
    const on=x.actif!==false, top=topId&&x.id===topId;
    return `<button class="tile${top?' top':''}" ${on?`onclick="${fn}('${x.id}')"`:'disabled'}>
      ${x.photo?`<img class="tile-photo" src="${esc(x.photo)}" alt="">`:''}
      <h3>${esc(x.nom)}</h3>${x.note?`<p>${esc(x.note)}</p>`:''}
      <span class="badge">${top?'Le plus consulté':(on?'Disponible':'Bientôt')}</span></button>`;
  }).join('')}</div>`;
}
const head=(s,t,l)=>`<span class="step">${esc(s)}</span><h1 class="title">${esc(t)}</h1>${l?`<p class="lede">${esc(l)}</p>`:''}`;

function render(v){
  const app=$('app'), a=find('automates',S.automate), c=find('categories',S.categorie),
        t=findType(S.type), m=find('marques',S.marque);

  if(v==='home'){
    crumbs([]);
    app.innerHTML=head('Étape 1 sur 7','Quel automate ?',
      'Le guide descend jusqu\u2019au matériel exact et jusqu\u2019à son mode de raccordement : câblage, réglages sur l\u2019appareil, intégration TIA Portal, programmation.')
      +tiles(DB.automates.filter(x=>x.actif),'goCat')+modelNote();return;
  }
  if(v==='categorie'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom}],'home');
    app.innerHTML=head('Étape 2 sur 7',a.nom+' — quel matériel ?','')
      +tiles(DB.categories.filter(x=>usedCategories.has(x.id)).map(x=>({...x,actif:true})),'goType')
      +blocsSystemeTile();return;
  }
  if(v==='blocsListe'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:'Bloc système'}],'categorie');
    const l=DB.blocsSysteme.map(x=>({id:x.id,nom:x.nom,note:x.sousTitre,actif:true}));
    app.innerHTML=head('Bloc système','Quel bloc système ?',
      'Des briques de programmation indépendantes de tout appareil — à connaître pour lire ou écrire n’importe quel programme TIA Portal.')
      +tiles(l,'goBlocGuide');return;
  }
  if(v==='blocGuide'){
    const bs=DB.blocsSysteme.find(x=>x.id===S.bloc);
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:'Bloc système',vue:'blocsListe'},{txt:bs.nom}],'blocsListe');
    app.innerHTML=Render.buildBlocArticle(bs)+modelNote();return;
  }
  if(v==='type'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom}],'categorie');
    const estCapteur=S.categorie==='capteur';
    app.innerHTML=head('Étape 3 sur 7',
      estCapteur?'Quelle grandeur mesurée ?':'Quelle fonction ?',
      estCapteur
        ?'On classe par ce qui est mesuré, pas par la technologie — un niveau se mesure au radar, à l\u2019ultrason ou en capacitif.'
        :'Un actionneur ne mesure rien : on le classe par ce qu\u2019il fait.')
      +tiles(sousTypes(S.categorie).filter(x=>usedTypes.has(S.categorie+'|'+x.id)).map(x=>({...x,actif:true})),'goMarque');return;
  }
  if(v==='marque'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},{txt:t.nom}],'type');
    const top={niveau:'keyence',temperature:'ifm',signalisation:'siemens-c',vitesse:'siemens-c'}[S.type];
    const marques=DB.marques.filter(x=>usedMarques.has(S.categorie+'|'+S.type+'|'+x.id)).map(x=>({...x,actif:true}));
    app.innerHTML=head('Étape 4 sur 7','Quelle marque ?','')+tiles(marques,'goModele',top);return;
  }
  if(v==='modele'){
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},{txt:t.nom,vue:'marque'},{txt:m.nom}],'marque');
    const l=DB.appareils.filter(d=>d.marque===S.marque&&d.type===S.type&&d.categorie===S.categorie)
      .map(d=>({id:d.id,nom:d.ref,note:d.nom+' — '+d.techno,actif:true,photo:d.photo}));
    app.innerHTML=head('Étape 5 sur 7','Quel modèle ?','')
      +(l.length?tiles(l,'goMode',l[0].id):`<div class="note"><b>Aucun appareil</b>Cette combinaison n\u2019est pas encore documentée.</div>`);return;
  }
  if(v==='mode'){
    const d=dev(S.modele);
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},
            {txt:t.nom,vue:'marque'},{txt:m.nom,vue:'modele'},{txt:d.ref}],'modele');
    const dispo=DB.modes.filter(x=>d.raccordements[x.id]).map(x=>({...x,actif:true}));
    app.innerHTML=head('Étape 6 sur 7','Comment le raccordez-vous ?',
      'C\u2019est ce choix qui détermine la procédure. Un même capteur en IO-Link ou en 4-20 mA n\u2019a rien de commun côté TIA Portal.')
      +tiles(dispo,'goGuide',dispo[0]&&dispo[0].id);return;
  }
  if(v==='voie'){
    const d=dev(S.modele);
    crumbs([{txt:'Automate',vue:'home'},{txt:a.nom,vue:'categorie'},{txt:c.nom,vue:'type'},
            {txt:t.nom,vue:'marque'},{txt:m.nom,vue:'modele'},{txt:d.ref,vue:'mode'},{txt:'IO-Link'}],'mode');
    app.innerHTML=head('Étape 7 sur 7','Quel maître IO-Link ?',
      'Le brochage du capteur ne change pas selon le maître — mais la procédure à suivre dans TIA Portal, si.')
      +tiles(DB.voiesIolink,'goVoie',DB.voiesIolink[0]&&DB.voiesIolink[0].id);return;
  }
  if(v==='guide')guide();
}

/* Tuile ajoutée sous la grille des catégories, pas dans tiles() :
   elle mène à une branche parallèle (les blocs système), pas à un
   sous-type de matériel — un onclick différent des autres tuiles
   de la même grille. */
function blocsSystemeTile(){
  return `<div class="grid" style="margin-top:14px">
    <button class="tile" onclick="goBlocs()">
      <h3>Blocs système</h3>
      <p>Temporisation, comptage, détection de front, comparaison, communication, conversion — des briques de programmation indépendantes de tout appareil.</p>
      <span class="badge">Disponible</span>
    </button>
  </div>`;
}
function modelNote(){
  return `<div class="model-note"><b>Comment cette maquette fonctionne</b>
  Aucune page n\u2019est écrite à la main. Chaque guide est assemblé à partir de quatre sources :
  la <strong>procédure du mode de raccordement</strong> (écrite une seule fois et partagée par tous les
  appareils), les <strong>caractéristiques de l\u2019appareil</strong>, son <strong>brochage</strong> — qui n\u2019est
  jamais générique — et, en IO-Link, la <strong>structure des données process</strong> lue dans son IODD.
  Le schéma d\u2019octets, la table de brochage et le code sont générés depuis ces données.</div>`;
}

/* ══════════════════════════════════════════════════════════
   PAGE GUIDE — assemblage délégué à render.js (partagé avec
   le générateur de pages statiques, src/build.js)
   ══════════════════════════════════════════════════════════ */

function guide(){
  const d=dev(S.modele), md=DB.modes.find(x=>x.id===S.mode);
  const voie=(S.mode==='iolink'&&S.voie)?DB.voiesIolink.find(x=>x.id===S.voie):null;
  const fil=[{txt:'Automate',vue:'home'},{txt:d.ref,vue:'mode'},{txt:md.nom,vue:voie?'voie':undefined}];
  if(voie)fil.push({txt:voie.nom});
  crumbs(fil,voie?'voie':'mode');
  $('app').innerHTML=Render.buildGuideArticle(DB,d,S.mode,S.voie)+modelNote();
}
function showLang(id,btn){
  document.querySelectorAll('.lang').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));
  $('lang-'+id).classList.add('on');btn.classList.add('on');
}

/* ── recherche ── */
function search(q){
  const box=$('res');q=q.trim().toLowerCase();
  if(q.length<2){box.innerHTML='';return}
  const hits=DB.appareils.filter(d=>(d.ref+' '+d.nom+' '+d.marqueNom+' '+d.techno).toLowerCase().includes(q));
  box.innerHTML=hits.length
    ?`<div class="results">${hits.map(d=>`<button onmousedown="openRef('${d.id}')">
       <span class="ref">${esc(d.ref)}</span> — ${esc(d.marqueNom)}<br>
       <span class="sub">${esc(d.nom)}</span></button>`).join('')}</div>`
    :`<div class="results"><button disabled style="color:var(--ink-3)">Aucun appareil documenté pour « ${esc(q)} »</button></div>`;
}
function openRef(id){
  const d=dev(id);
  S={automate:'siemens',categorie:d.categorie,type:d.type,marque:d.marque,modele:id,mode:null};
  hide();$('q').value='';window.scrollTo(0,0);pushView('mode');render('mode');
}
function hide(){$('res').innerHTML=''}

/* Bouton ← / → du navigateur : restaure l'état poussé pour cette entrée
   et rend la même vue — sans repousser, sinon boucle. Une entrée sans
   state (le tout premier chargement, avant go('home')) n'est pas la
   nôtre : on laisse le navigateur faire son comportement normal
   (quitter le site), plutôt que de forcer l'utilisateur à cliquer deux
   fois pour vraiment partir. */
window.addEventListener('popstate',e=>{
  if(!e.state)return;
  S=e.state.S;
  window.scrollTo(0,0);
  render(e.state.v);
});

/* Premier rendu : replaceState (pas pushView) pour que cette entrée
   fusionne avec celle déjà créée par le navigateur au chargement de la
   page, au lieu d'en empiler une deuxième par-dessus. */
S={automate:null,categorie:null,type:null,marque:null,modele:null,mode:null,bloc:null,voie:null};
history.replaceState({v:'home',S:{...S}},'',location.pathname);
render('home');
</script>
</body>
</html>
